<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>搜尋版圖</title>
<meta name="description" content="替品牌整理各地區該搶的搜尋字、該做的頁面、競品缺口和可用網域，產出 Markdown 與 LINE 報告。">
<meta property="og:title" content="搜尋版圖">
<meta property="og:description" content="SEO 與地區關鍵字策略、競品缺口、網域即時查詢與報告產出。">
<meta name="theme-color" content="#F4F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C141A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A56A0'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：測繪工作台——手機單欄由上而下；桌機左欄填品牌資料、右欄攤開成果；頁首是等高線地圖紙 */
:root{
  --paper:#F4F8FA;
  --sheet:#FFFFFF;
  --ink:#0E1C27;
  --ink-2:#435866;
  --rule:#C9D6DE;
  --contour:#D3E0E8;
  --accent:#0A56A0;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2EDF8;
  --mark:#FFE38A;
  --serp-link:#1A0DAB;
  --good:#17703D; --good-bg:#E2F3E8;
  --warn:#8A5A00; --warn-bg:#FFF1CF;
  --bad:#A8231B; --bad-bg:#FCE6E3;
  --shadow:0 1px 0 rgba(14,28,39,.05),0 12px 30px -20px rgba(14,28,39,.45);
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0C141A; --sheet:#131E26; --ink:#E5EDF2; --ink-2:#A6B8C3; --rule:#2A3A45; --contour:#1A2832;
    --accent:#7DB4F5; --accent-ink:#06223F; --accent-soft:#163049; --mark:#5A4812; --serp-link:#8AB4F8;
    --good:#73D49D; --good-bg:#11301F; --warn:#F0C25A; --warn-bg:#33270B; --bad:#FF8D84; --bad-bg:#3A1714;
    --shadow:0 1px 0 rgba(0,0,0,.35),0 12px 30px -20px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}

html{font-size:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
html[data-scale="lg"]{font-size:112.5%}
html[data-scale="xl"]{font-size:125%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{color:var(--ink-2);font-size:.9375rem;line-height:1.6}

/* 頁首：等高線地圖紙 */
.masthead{background-color:var(--paper);background-image:repeating-radial-gradient(ellipse 130% 95% at 96% -10%,transparent 0 21px,var(--contour) 21px 22.5px);border-bottom:2px solid var(--ink)}
.masthead-in{max-width:1240px;margin:0 auto;padding-block:26px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.brandmark{display:grid;gap:6px;min-width:0;max-width:38rem}
.eyebrow{font-family:var(--f-mono);font-size:.9375rem;letter-spacing:.06em;color:var(--ink-2)}
.brandmark h1{font-family:var(--f-display);font-weight:700;font-size:2.75rem;line-height:1.05;letter-spacing:.06em;margin:0}
.brandmark p.tagline{font-size:1.0625rem;color:var(--ink)}
.scale{display:flex;align-items:center;gap:8px}
.scale .lab{font-size:.9375rem;color:var(--ink-2)}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.seg button{min-height:40px;min-width:3.25rem;padding:0 12px;border:0;border-right:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:.9375rem;font-weight:700;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 主體 */
.desk{max-width:1240px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
@media (min-width:980px){
  .desk{grid-template-columns:minmax(320px,400px) minmax(0,1fr);align-items:start;gap:32px}
  .intake{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100vh - 28px);overflow:auto}
}

/* 輸入面板 */
.intake{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 20px;display:grid;gap:16px;min-width:0}
.intake-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.intake-head h2{font-family:var(--f-display);font-size:1.5rem;margin:0}
.badge-ex{display:inline-block;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 12px;font-size:.9375rem;font-weight:700}
.field{display:grid;gap:6px;min-width:0;border:0;margin:0;padding:0}
.field > label,.flabel{font-weight:700;padding:0}
.req{font-weight:500;color:var(--ink-2);font-size:.9375rem;margin-left:4px}
input[type="text"],input[type="search"],input[type="password"],textarea,select.select{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:1.0625rem;line-height:1.5}
textarea{min-height:5.5em;resize:vertical}
textarea.short{min-height:3.6em}
input[type="text"]:focus,input[type="search"]:focus,input[type="password"]:focus,textarea:focus,select.select:focus{border-color:var(--accent);outline:3px solid var(--accent-soft);outline-offset:0}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:.9375rem;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.custom{display:inline-flex;align-items:center;gap:6px;background:var(--mark);border-color:transparent;color:var(--ink);font-weight:500}
.chip.custom .x{font-weight:700;color:var(--ink-2)}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow input{flex:1 1 auto;min-width:0}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;cursor:pointer}
.opt input{width:1.375rem;height:1.375rem;margin:.22rem 0 0;accent-color:var(--accent)}
.opt b{display:block}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:1rem;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:52px;padding:0 26px;font-size:1.0625rem;flex:1 1 auto}
.btn.small{min-height:40px;padding:0 12px;font-size:.9375rem}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:0 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 分析進度與訊息 */
.run{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--accent-soft)}
.run-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{font-size:.9375rem;padding:1px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:var(--sheet)}
.stage.done{color:var(--good);border-color:var(--good)}
.stage.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:700}
.stage.fail{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.msg{padding:12px 14px;border-radius:10px;font-weight:500;line-height:1.6}
.msg.good{background:var(--good-bg);color:var(--good)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.avail{display:grid;gap:10px;justify-items:start}

/* 成果 */
.results{min-width:0}
.result-head{display:grid;gap:10px;padding-block:4px 10px}
.result-head .eyebrow{display:block;margin-bottom:2px}
.result-head .eyebrow.ex{color:var(--warn);font-weight:600}
.res-title{font-family:var(--f-display);font-size:2rem;line-height:1.2;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.res-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.res-tools .select{width:auto;max-width:100%;min-height:40px;padding:6px 10px;font-size:1rem}
.secnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding-block:10px;background:var(--paper);border-bottom:1px solid var(--rule);scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.navchip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-size:.9375rem;font-weight:700;cursor:pointer}
.sec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px);padding-block:24px;border-bottom:1px solid var(--rule);display:grid;gap:14px;min-width:0}
.sec:last-child{border-bottom:0}
.sec h2{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.25;margin:0}
.sec h3.sub-h{font-size:1.125rem;margin:6px 0 0}
.sec .sub{color:var(--ink-2);max-width:42rem}
.lead{font-size:1.125rem;max-width:42rem}
.position{font-family:var(--f-display);font-size:1.375rem;line-height:1.65;max-width:40rem}
.position span{background:linear-gradient(transparent 56%,var(--mark) 56%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:0}
.fact{background:var(--sheet);padding:12px 14px;min-width:0}
.fact dt{font-size:.9375rem;color:var(--ink-2)}
.fact dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact-sub{display:block;font-weight:500;font-size:.9375rem;color:var(--ink-2)}
.empty{color:var(--ink-2);padding:14px 0}
.mini{font-size:.9375rem;font-weight:700;color:var(--ink-2)}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:4px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-family:var(--f-display);font-size:1.375rem;margin:0;line-height:1.3}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}

/* 關鍵字 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters .select{width:auto;min-width:9rem;max-width:100%;min-height:40px;padding:6px 10px;font-size:1rem}
.filters input[type="search"]{flex:1 1 12rem;min-height:40px;padding:6px 12px;font-size:1rem}
.count{color:var(--ink-2);font-size:.9375rem;font-variant-numeric:tabular-nums}
.count.over{color:var(--warn);font-weight:700}
.kw-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.kw{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.prio{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:8px;font-weight:700;font-size:1.0625rem}
.p-hi{background:var(--accent);color:var(--accent-ink)}
.p-mid{background:var(--accent-soft);color:var(--accent)}
.p-lo{border:1.5px solid var(--rule);color:var(--ink-2)}
.kw-main{display:grid;gap:4px;min-width:0}
.kw-term{font-weight:700;font-size:1.1875rem;line-height:1.4;overflow-wrap:anywhere}
.kw-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:0 10px;border-radius:999px;border:1px solid var(--rule);font-size:.9375rem;line-height:1.7;color:var(--ink-2);background:var(--sheet)}
.tag.comp{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.kw-page{color:var(--ink-2);font-size:.9375rem}

/* 地區、競品卡片內的關鍵字 */
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-block;background:var(--mark);color:var(--ink);padding:0 8px;border-radius:4px;font-size:.9375rem;line-height:1.75}
.kadd{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border:0;border-radius:6px;background:var(--mark);color:var(--ink);font:inherit;font-size:.9375rem;cursor:pointer}
.kadd:disabled{cursor:default;opacity:.75}

/* 內容規劃與行動時程：順序就是建議的先後 */
.plan{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:step;border-top:1px solid var(--rule)}
.plan > li{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:0 12px;padding:14px 0;border-bottom:1px solid var(--rule);counter-increment:step}
.plan > li::before{content:counter(step);font-family:var(--f-mono);font-weight:600;font-size:1.625rem;line-height:1.2;color:var(--accent);font-variant-numeric:tabular-nums}
.plan-body{display:grid;gap:6px;min-width:0}
.plan-title{font-weight:700;font-size:1.1875rem;line-height:1.45}
.plan-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--ink-2);font-size:.9375rem}
.when{font-family:var(--f-mono);font-size:.9375rem;color:var(--accent);font-weight:600}

/* Meta 與搜尋結果預覽 */
.meta-body{display:grid;gap:14px}
.meta-edit{display:grid;gap:12px}
.meta-info{display:grid;gap:4px;font-size:.9375rem;color:var(--ink-2)}
.meta-info b{color:var(--ink)}
.serp-wrap{display:grid;gap:8px}
.serp{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;max-width:600px;width:100%;display:grid;gap:4px}
.serp[data-device="mobile"]{max-width:380px}
.serp-site{display:flex;gap:10px;align-items:center;min-width:0}
.serp-fav{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.9375rem}
.serp-meta{min-width:0}
.serp-name{font-size:.9375rem;line-height:1.3}
.serp-url{font-size:.9375rem;line-height:1.3;color:var(--ink-2);overflow-wrap:anywhere}
.serp-title{color:var(--serp-link);font-size:1.25rem;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;overflow-wrap:anywhere}
.serp[data-device="mobile"] .serp-title{-webkit-line-clamp:2}
.serp-desc{color:var(--ink);font-size:1rem;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.serp[data-device="mobile"] .serp-desc{-webkit-line-clamp:3}

/* 檢查清單 */
.checks{display:grid;gap:0;border-top:1px solid var(--rule)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--rule);cursor:pointer}
.check input{width:1.375rem;height:1.375rem;margin:.22rem 0 0;accent-color:var(--accent)}
.check input:checked + span{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1px}
.check b{display:block}

/* 程式碼與報告 */
pre.code,pre.report{margin:0;padding:16px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:.9375rem;line-height:1.7;color:var(--ink);background:var(--sheet)}
pre.code{max-height:22rem;border:1px solid var(--rule);border-radius:12px}
pre.report{max-height:30rem}
.report-box{border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tab{flex:1 1 0;min-height:48px;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.copy-fallback{width:100%;min-height:8rem;font-family:var(--f-mono);font-size:.9375rem;padding:10px;border:1.5px solid var(--accent);border-radius:10px;background:var(--paper);color:var(--ink)}

/* 網域 */
.notice{display:grid;gap:6px;padding:14px 16px;border-radius:12px;background:var(--accent-soft)}
.tld-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.dom-groups{display:grid;gap:14px}
.dom-group{border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow:hidden;min-width:0}
.dom-head{padding:12px 16px;border-bottom:1px solid var(--rule);display:grid;gap:2px}
.dom-head .base{font-family:var(--f-mono);font-weight:600;font-size:1.0625rem;overflow-wrap:anywhere}
.dom-head .title{font-weight:700}
.dom-row{display:grid;gap:8px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.dom-row:last-child{border-bottom:0}
.dom-id{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.dom-name{font-family:var(--f-mono);font-size:1.0625rem;overflow-wrap:anywhere;min-width:0}
.dom-state{font-size:.9375rem;font-weight:700;padding:0 10px;border-radius:999px;line-height:1.75;white-space:nowrap}
.st-none{color:var(--ink-2);border:1px solid var(--rule)}
.st-ok{color:var(--good);background:var(--good-bg)}
.st-taken{color:var(--bad);background:var(--bad-bg)}
.dom-detail{color:var(--ink-2);font-size:.9375rem}
.dom-actions{display:flex;flex-wrap:wrap;gap:8px}

/* 熱度與連結 */
.season{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:0}
.season > div{background:var(--sheet);padding:12px 14px}
.season dt{font-size:.9375rem;color:var(--ink-2)}
.season dd{margin:2px 0 0}
.linklist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.linklist li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.linklist li span{font-weight:700;overflow-wrap:anywhere;min-width:0}

/* 競品 */
.lvl{display:inline-block;padding:0 10px;border-radius:999px;font-size:.9375rem;font-weight:700;line-height:1.75}
.lvl-hi{background:var(--accent);color:var(--accent-ink)}
.lvl-mid{background:var(--accent-soft);color:var(--accent)}

<main class="desk">

    <div class="field">
      <label for="f-preset">套用範例</label>

    <div class="field">

      <input id="f-seeds" type="text" maxlength="160" placeholder="用頓號分開，例：抓漏、熱水器安裝">

      <textarea id="f-notes" class="short" maxlength="300" placeholder="例：只做 B2B、醫療廣告要守法規、旺季在年底"></textarea>

    <div class="field">
      <label for="f-comp">競爭對手</label>
      <input id="f-comp" type="text" maxlength="160" placeholder="品牌名稱或網址，可留白">

    </label>

    <div class="actions">
      <button id="runBtn" type="submit" class="btn primary big">開始分析</button>
      <button id="stopBtn" type="button" class="btn" hidden>停止</button>
    </div>
    <p class="hint">分析分 4 段進行，通常要 40 秒到 2 分鐘。</p>
    <p id="privacyNote" class="hint" hidden></p>

    <div id="runPanel" class="run" hidden>

      <div id="stages" class="stages"></div>
    </div>
    <p id="runMsg" class="msg" role="status" hidden></p>

    <div class="actions">
      <button id="clearBtn" type="button" class="btn quiet">清空表單</button>
    </div>
  </form>

  <section id="results" class="results" aria-label="分析成果">
    <div class="result-head">
      <div>
        <span id="resLabel" class="eyebrow"></span>
        <h2 id="resTitle" class="res-title"></h2>
      </div>
      <div id="resTools" class="res-tools"></div>
    </div>
    <nav id="secnav" class="secnav" aria-label="成果段落"></nav>
    <div id="resBody"></div>
  </section>
</main>

<footer class="foot">

  /* ---------- 正規化 AI 回覆 ---------- */
  function cleanSlug(v) {

  function normMeta(arr) {

    }).filter(Boolean).slice(0, 4);

  function normalize(d, inp) {
    d = d || {};

    var order = { '高': 0, '中': 1, '低': 2 };
    var out = {};
    out.summary = S(d.summary, 600);

      var o = { keyword: kw, type: pick(k.type, TYPES, '長尾'), intent: pick(k.intent, INTENTS, '資訊'), priority: prioMap[S(k.priority, 10).toLowerCase()] || '中', region: S(k.region, 30) || '全區', reason: S(k.reason, 180), page: S(k.page, 60), _i: i };
      if (k.from === 'comp') o.from = 'comp';
      return o;
    }).filter(Boolean).slice(0, 48).sort(function (a, b) { return (order[a.priority] - order[b.priority]) || (a._i - b._i); })
      .map(function (k) { delete k._i; return k; });
    out.regions = A(d.regions).map(function (r) {
      r = r || {};
      var name = S(r.region, 30);
      if (!name) return null;
      return { region: name, angle: S(r.angle, 220), keywords: strList(r.keywords, 40, 8), actions: strList(r.actions, 160, 6) };
    }).filter(Boolean).slice(0, 12);
    out.content = A(d.content).map(function (c) {
      c = c || {};
      var t = S(c.title, 80);
      if (!t) return null;
      return { title: t, format: pick(c.format, FORMATS, '部落格'), stage: pick(c.stage, STAGES_C, '需求評估'), keyword: S(c.keyword, 60), outline: strList(c.outline, 120, 6) };
    }).filter(Boolean).slice(0, 10);
    out.meta = normMeta(d.meta);

    out.onpage = strList(d.onpage, 200, 10);
    if (d.season && typeof d.season === 'object') {
      var se = { peak: S(d.season.peak, 200), low: S(d.season.low, 200), why: S(d.season.why, 240), related: strList(d.season.related, 40, 6) };
      if (se.peak || se.low || se.why || se.related.length) out.season = se;
    }
    var seen = {};

      return { name: name, why: S(x && x.why, 120) };
    }).filter(Boolean).slice(0, 8);
    out.data_needed = strList(d.data_needed, 240, 8);
    out.assumptions = strList(d.assumptions, 200, 6);
    if (d.ai_visibility && typeof d.ai_visibility === 'object') {

      if (v.questions.length || v.actions.length || v.facts.length) out.ai_visibility = v;
    }

  }
  function normComp(c) {
    c = c || {};
    var page = (c.page && typeof c.page === 'object') ? { title: S(c.page.title, 160), description: S(c.page.description, 300), h1: S(c.page.h1, 120) } : null;
    return {
      name: S(c.name, 160),
      url: S(c.url, 300),
      basis: ['fetched', 'provided'].indexOf(c.basis) >= 0 ? c.basis : 'general',
      page: page,

      }).filter(Boolean).slice(0, 5),
      quick_wins: A(c.quick_wins).map(function (q) { q = q || {}; var act = S(q.action, 140); return act ? { when: S(q.when, 20), action: act, why: S(q.why, 180) } : null; }).filter(Boolean).slice(0, 5),
      link_sources: A(c.link_sources).map(function (l) { l = l || {}; var ty = S(l.type, 60); return ty ? { type: ty, approach: S(l.approach, 220), anchor: S(l.anchor, 40), pitch: S(l.pitch, 120) } : null; }).filter(Boolean).slice(0, 6),

  function cleanLabel(v) {
    var s = String(v || '').toLowerCase().trim().replace(/^https?:\/\//, '').replace(/^www\./, '');
    s = s.split(/[./]/)[0].replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');

  }
  function cleanDomain(v) {
    var s = String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/[/?#].*$/, '');

    if (/[^\x00-\x7f]/.test(s)) return { ok: false, msg: '中文網域請直接到 TWNIC 官網查詢；這裡只收英文網域。' };

  /* ---------- 分析（分 4 段） ---------- */
  var ctl = null, timer = null, t0 = 0;
  function setRunning(on, title) {

  function partLabel(p) { var x = PARTS.filter(function (q) { return q[0] === p; })[0]; return x ? x[1] : String(p); }

  function runParts(inputs, ctx, parts, signal, raw, failed, errs) {
    return Promise.all(parts.map(function (p) {
      setPart(p, 'now');
      return api('analyze', { part: p, inputs: inputs, context: ctx }, signal)
        .then(function (j) { Object.assign(raw, (j.data && j.data.data) || {}); setPart(p, 'done'); },
          function (e) { if (e && e.code === 'cancelled') throw e; failed.push(p); errs.push(e); setPart(p, 'fail'); });
    }));
  }

  function runAnalysis() {
    if (busy) return;

    if (!validateForm()) return;
    save();
    if (!aiReady()) { showMsg(backendProblem() || ERR.network, 'bad'); return; }
    var inp = clone(state.inputs), payload = apiInputs(inp);

    partState = {};
    ctl = new AbortController();

    setPart(1, 'now');
    api('analyze', { part: 1, inputs: payload }, ctl.signal)
      .then(function (j) {
        Object.assign(raw, (j.data && j.data.data) || {});
        if (!raw.summary || !Array.isArray(raw.keywords) || !raw.keywords.length) throw { code: 'ai_format' };
        setPart(1, 'done');
        ctx = { summary: S(raw.summary, 600), keywords: A(raw.keywords).map(function (k) { return k && S(k.keyword, 60); }).filter(Boolean).slice(0, 12) };
        return runParts(payload, ctx, [2, 3, 4], ctl.signal, raw, failed, errs);
      })
      .then(function () {
        var norm = normalize(raw, inp);
        var u = backend.usage || {}, i = backend.info || {};
        var E = { id: 'r' + Date.now(), at: new Date().toISOString(), provider: u.provider || i.provider || '', model: u.model || i.model || '', inputs: inp, result: norm, checks: {}, compInput: null, missing: failed.sort(), ctx: ctx };

        state.metaIdx = 0; state.compEditing = false;

        else showMsg('分析完成，成果在下面。網域正在向註冊資料庫查詢。', 'good');

      })
      .catch(function (e) {

  function retryMissing() {
    var E = entry();
    if (!E || busy || !E.missing.length) return;
    if (!aiReady()) { toast(backendProblem()); return; }
    if (!E.ctx) E.ctx = { summary: E.result.summary, keywords: E.result.keywords.slice(0, 12).map(function (k) { return k.keyword; }) };
    var raw = {}, failed = [], errs = [], todo = E.missing.slice();
    partState = { 1: 'done' };

    ctl = new AbortController();

  /* ---------- 網域（RDAP） ---------- */
  var checking = {};

    var s = state.dstat[d];
    if (!s || s.s === 'unknown') return false;

    return !isNaN(t) && Date.now() - t < 24 * 3600 * 1000;
  }
  // 查過的網域只留最近 30 天、最多 300 筆，免得瀏覽器存太多
  function pruneDstat() {
    var keep = Object.keys(state.dstat).map(function (d) {
      var s = state.dstat[d], t = s && typeof s === 'object' ? Date.parse(s.at) : NaN;
      return [d, t];
    }).filter(function (x) { return !isNaN(x[1]) && Date.now() - x[1] < 30 * 24 * 3600 * 1000; })
      .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 300);

  function checkDomains(list, force) {
    if (!domainReady()) { if (force) toast(backendProblem()); return Promise.resolve(); }
    var todo = uniq(list).filter(function (d) { return !checking[d] && (force || !fresh(d)); });
    if (!todo.length) return Promise.resolve();
    todo.forEach(function (d) { checking[d] = true; });
    refreshSection('domains');
    var chunks = [];
    for (var i = 0; i < todo.length; i += 12) chunks.push(todo.slice(i, i + 12));
    var stop = null;
    var p = Promise.resolve();
    chunks.forEach(function (c) {
      p = p.then(function () {
        if (stop) { c.forEach(function (d) { delete checking[d]; }); return; }
        return api('domains', { domains: c }, null, 90000)
          .then(function (j) {
            A(j.data && j.data.results).forEach(function (r) {
              if (r && r.domain) state.dstat[r.domain] = { s: r.s, at: new Date().toISOString(), created: S(r.created, 20), expires: S(r.expires, 20), registrar: S(r.registrar, 80), note: S(r.note, 120) };
            });
          }, function (e) {

            if (e && ['limit_domain', 'need_code', 'network', 'bad_response'].indexOf(e.code) >= 0) { stop = e; toast(errText(e)); }
          })
          .then(function () { c.forEach(function (d) { delete checking[d]; }); save(); refreshSection('domains'); refreshReport(); });
      });
    });

  }

    allDomains().forEach(function (d) { var x = dstatLine(d); L.push('| ' + d + ' | ' + x[0] + ' | ' + esc(x[1]) + ' | ' + x[2] + ' |'); });
    L.push('', '> 狀態來自官方註冊資料庫（RDAP）的即時查詢。查無註冊紀錄不代表一定買得到，以註冊商的結帳頁為準。');
    if (R.domains.length) { L.push('', '候選名稱的理由：'); R.domains.forEach(function (d) { L.push('- ' + d.name + '：' + d.why); }); }
    if (R.data_needed.length) { L.push('', '## 要用真實數據驗證的地方', ''); list(R.data_needed); }
    if (R.assumptions.length) { L.push('', '## 分析假設', ''); list(R.assumptions); }
    L.push('');
    return L.join('\n');
  }

  function buildLine() {
    var R = cur(), inp = curInputs(), E = entry(), L = [];
    var day = E ? (function () { var d = new Date(E.at); return (d.getMonth() + 1) + '/' + d.getDate(); })() : '範例';
    L.push('📍 ' + plain(inp.brand) + ' 搜尋策略重點（' + day + '）', '');
    L.push('✅ 策略總結', plain(R.summary), '');
    if (R.positioning) L.push('🎯 搜尋定位', plain(R.positioning), '');
    var hi = R.keywords.filter(function (k) { return k.priority === '高'; });
    if (hi.length) { L.push('🔑 優先關鍵字'); hi.slice(0, 10).forEach(function (k, i) { L.push(fw(i + 1) + plain(k.keyword) + '（' + plain(k.region) + '）'); }); L.push(''); }
    if (R.regions.length) { L.push('🗺️ 地區切角'); R.regions.forEach(function (r, i) { L.push(fw(i + 1) + plain(r.region) + '：' + plain(r.angle)); }); L.push(''); }
    if (R.content.length) { L.push('📝 先做這幾頁'); R.content.slice(0, 3).forEach(function (c, i) { L.push(fw(i + 1) + plain(c.title) + '（' + c.format + '）'); }); L.push(''); }
    if (R.meta.length) { L.push('🏷️ 首頁標題'); L.push(plain(R.meta[0].title)); L.push(''); }
    var C = R.competitor;
    if (C && C.quick_wins.length) { L.push('🏁 對付競品，先做這幾件事'); C.quick_wins.forEach(function (q, i) { L.push(fw(i + 1) + (q.when ? plain(q.when) + '：' : '') + plain(q.action)); }); L.push(''); }
    var doms = allDomains().filter(function (d) { var m = state.dstat[d]; return m && (m.s === 'free' || m.s === 'taken'); });
    doms.sort(function (a, b) { return (state.dstat[a].s === 'free' ? 0 : 1) - (state.dstat[b].s === 'free' ? 0 : 1); });
    L.push('🌐 網域查核');
    if (doms.length) doms.forEach(function (d, i) { var m = state.dstat[d]; L.push(fw(i + 1) + d + '：' + (m.s === 'free' ? '查無註冊紀錄，可以試著購買' : '已被註冊' + (m.expires ? '（到期 ' + m.expires + '）' : ''))); });
    else L.push('還沒查詢');
    L.push('', '⚠️ 提醒：優先度和淡旺季是 AI 依產業性質判斷，沒有用搜尋量數據；網域查無註冊不代表一定買得到，以註冊商結帳頁為準。');
    return L.join('\n');
  }

  /* ---------- 複製、下載、提示 ---------- */
  var toastTimer = null;
  function toast(text) {
    var t = $('#toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function copyQuiet(text, label) {
    try {
      var p = navigator.clipboard && navigator.clipboard.writeText(text);
      if (p && p.then) p.then(function () { toast('已複製 ' + text + '，到 ' + label + ' 查詢頁貼上就好'); }, function () { toast('請在 ' + label + ' 查詢頁輸入 ' + text); });
      else toast('請在 ' + label + ' 查詢頁輸入 ' + text);
    } catch (e) { toast('請在 ' + label + ' 查詢頁輸入 ' + text); }
  }
  function copyText(text, okMsg, inReport) {
    function fail() {
      var ta = inReport ? $('#copyFallback') : null;
      if (ta) { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); toast('沒辦法自動複製，已幫你選取文字，請手動複製'); }
      else toast('沒辦法自動複製，請長按文字手動複製');
    }
    try {
      var p = navigator.clipboard && navigator.clipboard.writeText(text);
      if (p && p.then) p.then(function () { toast(okMsg); }, fail); else fail();
    } catch (e) { fail(); }
  }
  function saveFile(name, text, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      toast('已下載：' + name);
    } catch (e) { toast('這個瀏覽器不能直接下載，請改用複製'); }
  }
  function saveReport() {
    var md = state.tab === 'md';
    saveFile(safeName(curInputs().brand) + '-搜尋策略-' + ymdCompact(new Date()) + (md ? '.md' : '.txt'), md ? buildMarkdown() : buildLine(), md ? 'text/markdown;charset=utf-8' : 'text/plain;charset=utf-8');
  }
  function saveCsv() {
    var R = cur();
    function cell(x) { return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }
    var rows = [['優先度', '關鍵字', '類型', '意圖', '地區', '對應頁面', '判斷依據', '來源']].concat(R.keywords.map(function (k) {
      return [k.priority, k.keyword, k.type, k.intent, k.region, k.page, k.reason, k.from === 'comp' ? '競品缺口' : 'AI 分析'];
    }));
    saveFile(safeName(curInputs().brand) + '-關鍵字-' + ymdCompact(new Date()) + '.csv', '﻿' + rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n'), 'text/csv;charset=utf-8');
  }

  /* ---------- 字級 ---------- */
  function applyScale() {
    document.documentElement.setAttribute('data-scale', state.scale);
    $all('.scale button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.scale === state.scale)); });
  }

  /* ---------- 啟動 ---------- */
  function bind() {
    $all('.scale button').forEach(function (b) { b.addEventListener('click', function () { state.scale = b.dataset.scale; applyScale(); save(); }); });
    $('#intake').addEventListener('submit', function (e) { e.preventDefault(); runAnalysis(); });
    $('#stopBtn').addEventListener('click', function () { if (ctl) ctl.abort(); });
    $('#retryInfo').addEventListener('click', loadInfo);
    $('#addRegion').addEventListener('click', addCustomRegion);
    $('#f-region').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addCustomRegion(); } });
    [F.brand, F.offer, F.feat, F.aud, F.seeds, F.notes, F.comp, F.site].forEach(function (f) {
      f.addEventListener('input', function () { markEdited(); if (f === F.brand) clearErr('brand'); if (f === F.offer) clearErr('offer'); });
    });
    F.aivis.addEventListener('change', markEdited);
    F.code.addEventListener('input', function () { state.code = F.code.value.trim(); saveSoon(); });
    $('#clearBtn').addEventListener('click', function () {
      state.inputs = blankInputs(); state.edited = true;
      renderForm(); save(); F.brand.focus();
    });
    var ps = $('#f-preset');
    PRESETS.forEach(function (p) { ps.append(h('option', { value: p.id }, p.label)); });
    ps.addEventListener('change', function () {
      var p = PRESETS.filter(function (x) { return x.id === ps.value; })[0];
      if (!p) return;
      state.inputs = cleanInputs(clone(p.inputs)); state.edited = false;
      ['brand', 'offer', 'region'].forEach(clearErr);
      renderForm(); save();
      ps.value = '';
      toast('已填入範例：' + p.inputs.brand);
    });
  }

  function init() {
    EX.result = normalize(clone(EXAMPLE_RESULT), EXAMPLE_INPUTS);
    restore();
    grabForm();
    applyScale();
    renderForm();
    if (state.code) $('#codeRow').hidden = false;
    renderResults();
    bind();
    renderParts();
    renderBackend();
    loadInfo();
  }
  init();
})();
</script>
</body>
</html>
